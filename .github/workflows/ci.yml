# Build and test on every push and pull request. No signing here: the release key never leaves the author's PC.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build (zero warnings)
        run: dotnet build Baton.slnx -warnaserror
      - name: Test (xUnit and the extension's Node tests)
        run: dotnet test Baton.slnx --no-build
      - name: Build the extension
        run: node tools/build-extension.mjs
