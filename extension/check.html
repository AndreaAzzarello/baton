<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="checkTitle">Baton</title>
  <link rel="stylesheet" href="check.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="checkTitle"></h1>
        <p class="muted" data-i18n="checkIntro"></p>
      </div>
    </header>

    <section id="result" class="result" role="status" aria-live="polite">
      <h2 id="resultTitle" data-i18n="statusChecking"></h2>
      <p id="resultText"></p>
      <ol id="steps" hidden></ol>
      <div class="actions">
        <a id="register" class="button primary" href="baton:register" hidden data-i18n="checkRegister"></a>
        <button id="retry" class="button" type="button" data-i18n="checkRetry"></button>
      </div>
    </section>

    <dl class="facts">
      <dt data-i18n="checkExtension"></dt><dd id="extension"></dd>
      <dt data-i18n="checkHost"></dt><dd id="host"></dd>
      <dt data-i18n="checkApp"></dt><dd id="app"></dd>
    </dl>
  </main>
  <script type="module" src="check.js"></script>
</body>
</html>
