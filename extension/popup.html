<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DownloadManager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>DownloadManager</h1>
    <p id="status" class="chip" role="status"><span class="dot" aria-hidden="true"></span><span id="statusText" data-i18n="statusChecking"></span></p>
  </header>

  <fieldset class="modes">
    <legend data-i18n="modeLegend"></legend>
    <label class="mode">
      <input type="radio" name="mode" value="auto">
      <span><b data-i18n="modeAuto"></b><small data-i18n="modeAutoHint"></small></span>
    </label>
    <label class="mode">
      <input type="radio" name="mode" value="menu">
      <span><b data-i18n="modeMenu"></b><small data-i18n="modeMenuHint"></small></span>
    </label>
  </fieldset>

  <label for="queue" class="label" data-i18n="queueLabel"></label>
  <select id="queue" aria-describedby="queueHint"></select>
  <p id="queueHint" class="hint" data-i18n="queueHint"></p>

  <section id="site" class="site" hidden>
    <h2 id="siteName"></h2>
    <label for="siteRule" class="label" data-i18n="siteRuleLabel"></label>
    <select id="siteRule">
      <option value="" data-i18n="siteRuleNormal"></option>
      <option value="always" data-i18n="siteRuleAlways"></option>
      <option value="never" data-i18n="siteRuleNever"></option>
    </select>
    <label class="row">
      <input type="checkbox" id="siteButton">
      <span data-i18n="siteButton"></span>
    </label>
  </section>

  <details>
    <summary data-i18n="rulesTitle"></summary>
    <label for="extensions" class="label" data-i18n="extensionsLabel"></label>
    <textarea id="extensions" rows="3" spellcheck="false"></textarea>
    <label for="minSize" class="label" data-i18n="minSizeLabel"></label>
    <input type="number" id="minSize" min="0" step="1">
    <label for="alwaysSites" class="label" data-i18n="alwaysSitesLabel"></label>
    <textarea id="alwaysSites" rows="2" spellcheck="false" data-i18n-placeholder="sitesPlaceholder"></textarea>
    <label for="neverSites" class="label" data-i18n="neverSitesLabel"></label>
    <textarea id="neverSites" rows="2" spellcheck="false" data-i18n-placeholder="sitesPlaceholder"></textarea>
    <label class="row">
      <input type="checkbox" id="mediaButton">
      <span data-i18n="mediaButtonSetting"></span>
    </label>
    <label for="mediaDisabledSites" class="label" data-i18n="mediaDisabledLabel"></label>
    <textarea id="mediaDisabledSites" rows="2" spellcheck="false" data-i18n-placeholder="sitesPlaceholder"></textarea>
  </details>

  <footer>
    <p class="hint" data-i18n="altHint"></p>
    <a href="check.html" target="_blank" id="check" data-i18n="checkLink"></a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
